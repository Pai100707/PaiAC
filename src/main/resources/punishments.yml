config-version: 2

# ENFORCE: CANCEL_ACTION / SETBACK / KICK / TEMPBAN / BAN are really executed.
# DETECTION_ONLY: nothing is ever done to players, everything is logged as a dry-run.
enforcement-mode: ENFORCE

# Must be true for TEMPBAN / BAN to run automatically (second safety switch).
auto-ban-enabled: true

cancel-duration-ms: 1000     # how long CANCEL_ACTION cancels that check's actions (reach hits, crystal hits)
duplicate-guard-ms: 3000     # after a kick/ban, another removal of the same player waits this long

# Reasons support: {check} (the check or "total"), {vl}, {last-check} (the check that flagged last).
# NOTE: violations.max-vl in config.yml (default 100) caps the VL of EACH check. Per-check thresholds must not exceed it.
# Each entry fires when VL reaches `vl` and re-arms after VL decays below it.
# If several KICK/TEMPBAN/BAN entries are crossed at once (for example after rejoining), only the most severe one runs.
# repeat-every: fire again every N additional VL.

# Used by any check that has no entry under `checks:` below.
default-thresholds:
  - { vl: 5, action: ALERT }
  - { vl: 10, action: LOG }
  - { vl: 20, action: KICK, reason: "Suspicious behaviour detected ({check})" }
  - { vl: 30, action: TEMPBAN, duration: 2h, reason: "Cheating detected ({check})" }
  - { vl: 50, action: TEMPBAN, duration: 1d, reason: "Cheating detected ({check})" }
  - { vl: 80, action: TEMPBAN, duration: 7d, reason: "Cheating detected ({check})" }
  - { vl: 100, action: BAN, reason: "Cheating detected ({check})" }

# TOTAL VL = the sum of the VL of every check for that player. It is checked after every flag together with the
# per-check list, and decays together with the per-check VL. Usable actions: ALERT, LOG, SETBACK, KICK, TEMPBAN, BAN.
# (CANCEL_ACTION here cancels the actions of the check that flagged last.) This list has no upper limit.
total-thresholds:
  - { vl: 20, action: ALERT }
  - { vl: 40, action: LOG }
  - { vl: 60, action: KICK, reason: "Suspicious behaviour, total VL {vl} (last: {last-check})" }
  - { vl: 100, action: TEMPBAN, duration: 2h, reason: "Cheating detected, total VL {vl} (last: {last-check})" }
  - { vl: 160, action: TEMPBAN, duration: 1d, reason: "Cheating detected, total VL {vl} (last: {last-check})" }
  - { vl: 250, action: TEMPBAN, duration: 7d, reason: "Cheating detected, total VL {vl} (last: {last-check})" }
  - { vl: 400, action: BAN, reason: "Cheating detected, total VL {vl}" }

# A per-check list REPLACES the default list for that check.
checks:
  # ---------------- movement (SETBACK teleports back to the last safe position)
  fly:
    thresholds:
      - { vl: 3, action: ALERT }
      - { vl: 4, action: SETBACK, repeat-every: 2 }
      - { vl: 10, action: KICK, reason: "Fly" }
      - { vl: 14, action: TEMPBAN, duration: 1h, reason: "Fly" }
      - { vl: 25, action: TEMPBAN, duration: 1d, reason: "Fly" }
      - { vl: 50, action: TEMPBAN, duration: 7d, reason: "Fly" }
      - { vl: 90, action: BAN, reason: "Fly" }

  boat-fly:
    thresholds:
      - { vl: 3, action: ALERT }
      - { vl: 4, action: SETBACK, repeat-every: 2 }
      - { vl: 10, action: KICK, reason: "Boat fly" }
      - { vl: 14, action: TEMPBAN, duration: 1h, reason: "Boat fly" }
      - { vl: 25, action: TEMPBAN, duration: 1d, reason: "Boat fly" }
      - { vl: 50, action: TEMPBAN, duration: 7d, reason: "Boat fly" }
      - { vl: 90, action: BAN, reason: "Boat fly" }

  speed:   # noisier check: higher numbers before removal
    thresholds:
      - { vl: 5, action: ALERT }
      - { vl: 8, action: SETBACK, repeat-every: 3 }
      - { vl: 20, action: KICK, reason: "Speed" }
      - { vl: 30, action: TEMPBAN, duration: 1h, reason: "Speed" }
      - { vl: 60, action: TEMPBAN, duration: 1d, reason: "Speed" }
      - { vl: 100, action: BAN, reason: "Speed" }

  # ---------------- combat
  reach:   # CANCEL_ACTION cancels the over-reach hits
    thresholds:
      - { vl: 5, action: ALERT }
      - { vl: 8, action: CANCEL_ACTION }
      - { vl: 25, action: KICK, reason: "Reach" }
      - { vl: 35, action: TEMPBAN, duration: 2h, reason: "Reach" }
      - { vl: 60, action: TEMPBAN, duration: 1d, reason: "Reach" }
      - { vl: 100, action: BAN, reason: "Reach" }

  kill-aura:
    thresholds:
      - { vl: 4, action: ALERT }
      - { vl: 8, action: LOG }
      - { vl: 15, action: KICK, reason: "Kill aura" }
      - { vl: 25, action: TEMPBAN, duration: 2h, reason: "Kill aura" }
      - { vl: 50, action: TEMPBAN, duration: 1d, reason: "Kill aura" }
      - { vl: 80, action: TEMPBAN, duration: 7d, reason: "Kill aura" }
      - { vl: 100, action: BAN, reason: "Kill aura" }

  auto-clicker:   # false-positive prone: slow ladder
    thresholds:
      - { vl: 5, action: ALERT }
      - { vl: 20, action: KICK, reason: "Auto clicker" }
      - { vl: 30, action: TEMPBAN, duration: 1h, reason: "Auto clicker" }
      - { vl: 60, action: TEMPBAN, duration: 1d, reason: "Auto clicker" }
      - { vl: 100, action: BAN, reason: "Auto clicker" }

  # ---------------- crystal / anchor / totem / xp
  crystal-macro:   # CANCEL_ACTION cancels crystal hits
    thresholds:
      - { vl: 2, action: ALERT }
      - { vl: 3, action: CANCEL_ACTION }
      - { vl: 6, action: KICK, reason: "Crystal macro" }
      - { vl: 10, action: TEMPBAN, duration: 2h, reason: "Crystal macro" }
      - { vl: 20, action: TEMPBAN, duration: 1d, reason: "Crystal macro" }
      - { vl: 40, action: TEMPBAN, duration: 7d, reason: "Crystal macro" }
      - { vl: 80, action: BAN, reason: "Crystal macro" }

  anchor-charge:
    thresholds:
      - { vl: 2, action: ALERT }
      - { vl: 5, action: KICK, reason: "Anchor macro" }
      - { vl: 8, action: TEMPBAN, duration: 2h, reason: "Anchor macro" }
      - { vl: 15, action: TEMPBAN, duration: 1d, reason: "Anchor macro" }
      - { vl: 30, action: TEMPBAN, duration: 7d, reason: "Anchor macro" }
      - { vl: 60, action: BAN, reason: "Anchor macro" }

  anchor-sequence:
    thresholds:
      - { vl: 2, action: ALERT }
      - { vl: 5, action: KICK, reason: "Anchor macro" }
      - { vl: 8, action: TEMPBAN, duration: 2h, reason: "Anchor macro" }
      - { vl: 15, action: TEMPBAN, duration: 1d, reason: "Anchor macro" }
      - { vl: 30, action: TEMPBAN, duration: 7d, reason: "Anchor macro" }
      - { vl: 60, action: BAN, reason: "Anchor macro" }

  anchor-switch:
    thresholds:
      - { vl: 2, action: ALERT }
      - { vl: 5, action: KICK, reason: "Anchor macro" }
      - { vl: 8, action: TEMPBAN, duration: 2h, reason: "Anchor macro" }
      - { vl: 15, action: TEMPBAN, duration: 1d, reason: "Anchor macro" }
      - { vl: 30, action: TEMPBAN, duration: 7d, reason: "Anchor macro" }
      - { vl: 60, action: BAN, reason: "Anchor macro" }

  auto-totem:
    thresholds:
      - { vl: 2, action: ALERT }
      - { vl: 4, action: KICK, reason: "Auto totem" }
      - { vl: 7, action: TEMPBAN, duration: 2h, reason: "Auto totem" }
      - { vl: 14, action: TEMPBAN, duration: 1d, reason: "Auto totem" }
      - { vl: 30, action: TEMPBAN, duration: 7d, reason: "Auto totem" }
      - { vl: 60, action: BAN, reason: "Auto totem" }

  fast-xp:   # excess throws are already cancelled by the check itself
    thresholds:
      - { vl: 5, action: ALERT }
      - { vl: 15, action: KICK, reason: "Fast XP bottles" }
      - { vl: 30, action: TEMPBAN, duration: 1h, reason: "Fast XP bottles" }
      - { vl: 60, action: TEMPBAN, duration: 1d, reason: "Fast XP bottles" }
      - { vl: 100, action: BAN, reason: "Fast XP bottles" }
